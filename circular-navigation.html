<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Navegação circular — demo</title>
<link rel="icon" href="favicon.ico" sizes="any">
<style>
html, body { margin: 0; padding: 0; background: #0a0a0b; }
.cnav-demo {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  width: 100%;
  min-height: 100svh;
  margin: 0;
  padding: 32px;
  overflow: hidden;
  background:
    radial-gradient(32% 40% at 38% 44%, rgba(255, 94, 58, .32), transparent 70%),
    radial-gradient(30% 38% at 62% 56%, rgba(91, 91, 255, .34), transparent 70%),
    #0a0a0b;
  font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: #fff;
  text-align: center;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.cnav-demo__eyebrow { margin: 0; font-size: 14px; font-weight: 400; line-height: 20px; color: rgba(255, 255, 255, .55); }
.cnav-demo__title {
  margin: 4px 0 32px;
  font-family: inherit;
  font-size: 56px;
  font-weight: 600;
  line-height: 64px;
  letter-spacing: -.02em;
  color: #fff;
}
.cnav-demo__open {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  margin: 0;
  padding: 0 18px 0 16px;
  border: 0;
  border-radius: 999px;
  background: #fff;
  color: #0a0a0b;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  line-height: 20px;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  transition: background-color .2s, scale .2s;
}
.cnav-demo__open:hover { background: rgba(255, 255, 255, .88); }
.cnav-demo__open:active { scale: .97; }
.cnav-demo__open:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.cnav-demo__icon { display: block; width: 16px; height: 16px; }

/* o anel branco que se abre em volta do botão e some, a cada 2 s, até o menu abrir pela primeira vez */
@keyframes cnav-demo-pulse {
  0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, .5); }
  70% { box-shadow: 0 0 0 16px rgba(255, 255, 255, 0); }
  100% { box-shadow: 0 0 0 16px rgba(255, 255, 255, 0); }
}
.cnav-demo__open.is-pulsing { animation: cnav-demo-pulse 2s cubic-bezier(.4, 0, .6, 1) infinite; }
@media (prefers-reduced-motion: reduce) { .cnav-demo__open.is-pulsing { animation: none; } }
</style>
</head>
<body>
  <main class="cnav-demo">
    <p class="cnav-demo__eyebrow">Você está em</p>
    <h1 class="cnav-demo__title" id="cnavDemoTitle">Início</h1>
    <button type="button" class="cnav-demo__open is-pulsing" id="cnavDemoOpen" aria-haspopup="dialog" aria-expanded="false">
      Abrir navegação
    </button>
  </main>

  <script src="assets/js/circular-navigation.js?v=1"></script>
  <script>
  (function () {
    var navItems = [
      { name: 'Início', icon: 'house', href: '#inicio' },
      { name: 'Filmes', icon: 'film', href: '#filmes' },
      { name: 'Música', icon: 'music', href: '#musica' },
      { name: 'Esportes', icon: 'trophy', href: '#esportes' },
      { name: 'Notícias', icon: 'file-text', href: '#noticias' },
      { name: 'Ajustes', icon: 'settings', href: '#ajustes' },
      { name: 'Busca', icon: 'search', href: '#busca' }
    ];
    var title = document.getElementById('cnavDemoTitle');
    var btn = document.getElementById('cnavDemoOpen');
    btn.insertBefore(CircularNavigation.icon('menu', 'cnav-demo__icon'), btn.firstChild);

    var nav = CircularNavigation.create({
      navItems: navItems,
      activeHref: navItems[0].href,
      onNavigate: function (item, event) {
        // troca a seção sem sair da página, como faria o router de um projeto
        event.preventDefault();
        title.textContent = item.name;
        nav.setActive(item.href);
      },
      onToggle: function (open) {
        btn.setAttribute('aria-expanded', String(open));
        if (open) btn.classList.remove('is-pulsing');
      }
    });
    btn.addEventListener('click', nav.toggle);
  })();
  </script>
</body>
</html>
